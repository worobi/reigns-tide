services:
  site:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ./site:/usr/share/nginx/html:ro
    networks:
      - coolify
    labels:
      traefik.enable: "true"
      traefik.http.middlewares.reigns-tide-gzip.compress: "true"
      traefik.http.middlewares.reigns-tide-https.redirectscheme.scheme: "https"
      traefik.http.routers.reigns-tide-http.entryPoints: "http"
      traefik.http.routers.reigns-tide-http.middlewares: "reigns-tide-https"
      traefik.http.routers.reigns-tide-http.rule: "Host(`reignstide.org`) || Host(`www.reignstide.org`)"
      traefik.http.routers.reigns-tide-https.entryPoints: "https"
      traefik.http.routers.reigns-tide-https.middlewares: "reigns-tide-gzip"
      traefik.http.routers.reigns-tide-https.rule: "Host(`reignstide.org`) || Host(`www.reignstide.org`)"
      traefik.http.routers.reigns-tide-https.tls: "true"
      traefik.http.routers.reigns-tide-https.tls.certresolver: "letsencrypt"
      traefik.http.services.reigns-tide.loadbalancer.server.port: "80"

  directus:
    image: directus/directus:11
    restart: unless-stopped
    volumes:
      - ./cms/database:/directus/database
      - ./cms/uploads:/directus/uploads
      - ./cms/extensions:/directus/extensions
    environment:
      SECRET: ${DIRECTUS_SECRET}
      ADMIN_EMAIL: ${DIRECTUS_ADMIN_EMAIL}
      ADMIN_PASSWORD: ${DIRECTUS_ADMIN_PASSWORD}
      DB_CLIENT: sqlite3
      DB_FILENAME: /directus/database/data.db
      PUBLIC_URL: ${PUBLIC_URL}
      CORS_ENABLED: "true"
      CORS_ORIGIN: ${CORS_ORIGIN}
      WEBSOCKETS_ENABLED: "true"
      TURNSTILE_SECRET: ${TURNSTILE_SECRET}
      TURNSTILE_HOSTNAMES: ${TURNSTILE_HOSTNAMES}
      STORE_ENABLED: ${STORE_ENABLED:-false}
      PRINTFUL_API_KEY: ${PRINTFUL_API_KEY}
      PRINTFUL_STORE_ID: ${PRINTFUL_STORE_ID:-}
    networks:
      - coolify
    labels:
      traefik.enable: "true"
      traefik.http.middlewares.reigns-tide-cms-gzip.compress: "true"
      traefik.http.middlewares.reigns-tide-cms-https.redirectscheme.scheme: "https"
      traefik.http.routers.reigns-tide-cms-http.entryPoints: "http"
      traefik.http.routers.reigns-tide-cms-http.middlewares: "reigns-tide-cms-https"
      traefik.http.routers.reigns-tide-cms-http.rule: "Host(`cms.reignstide.org`)"
      traefik.http.routers.reigns-tide-cms-https.entryPoints: "https"
      traefik.http.routers.reigns-tide-cms-https.middlewares: "reigns-tide-cms-gzip"
      traefik.http.routers.reigns-tide-cms-https.rule: "Host(`cms.reignstide.org`)"
      traefik.http.routers.reigns-tide-cms-https.tls: "true"
      traefik.http.routers.reigns-tide-cms-https.tls.certresolver: "letsencrypt"
      traefik.http.services.reigns-tide-cms.loadbalancer.server.port: "8055"

  wordpress-db:
    image: mariadb:11.4
    restart: unless-stopped
    command: --transaction-isolation=READ-COMMITTED --binlog-format=ROW
    volumes:
      - ./wordpress/db:/var/lib/mysql
    environment:
      MARIADB_DATABASE: ${WORDPRESS_DB_NAME}
      MARIADB_USER: ${WORDPRESS_DB_USER}
      MARIADB_PASSWORD: ${WORDPRESS_DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${WORDPRESS_DB_ROOT_PASSWORD}
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - wordpress

  wordpress:
    image: wordpress:php8.3-apache
    restart: unless-stopped
    depends_on:
      wordpress-db:
        condition: service_healthy
    volumes:
      - ./wordpress/html:/var/www/html
    environment:
      WORDPRESS_DB_HOST: wordpress-db:3306
      WORDPRESS_DB_NAME: ${WORDPRESS_DB_NAME}
      WORDPRESS_DB_USER: ${WORDPRESS_DB_USER}
      WORDPRESS_DB_PASSWORD: ${WORDPRESS_DB_PASSWORD}
      WORDPRESS_AUTH_KEY: ${WORDPRESS_AUTH_KEY}
      WORDPRESS_SECURE_AUTH_KEY: ${WORDPRESS_SECURE_AUTH_KEY}
      WORDPRESS_LOGGED_IN_KEY: ${WORDPRESS_LOGGED_IN_KEY}
      WORDPRESS_NONCE_KEY: ${WORDPRESS_NONCE_KEY}
      WORDPRESS_AUTH_SALT: ${WORDPRESS_AUTH_SALT}
      WORDPRESS_SECURE_AUTH_SALT: ${WORDPRESS_SECURE_AUTH_SALT}
      WORDPRESS_LOGGED_IN_SALT: ${WORDPRESS_LOGGED_IN_SALT}
      WORDPRESS_NONCE_SALT: ${WORDPRESS_NONCE_SALT}
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_MEMORY_LIMIT', '256M');
        define('WP_MAX_MEMORY_LIMIT', '512M');
        define('FORCE_SSL_ADMIN', true);
        if (isset($$_SERVER['HTTP_X_FORWARDED_PROTO']) && strpos($$_SERVER['HTTP_X_FORWARDED_PROTO'], 'https') !== false) {
          $$_SERVER['HTTPS'] = 'on';
        }
        define('DISALLOW_FILE_EDIT', true);
    networks:
      - coolify
      - wordpress
    labels:
      traefik.enable: "true"
      traefik.http.middlewares.reigns-tide-shop-gzip.compress: "true"
      traefik.http.middlewares.reigns-tide-shop-https.redirectscheme.scheme: "https"
      traefik.http.routers.reigns-tide-shop-http.entryPoints: "http"
      traefik.http.routers.reigns-tide-shop-http.middlewares: "reigns-tide-shop-https"
      traefik.http.routers.reigns-tide-shop-http.rule: "Host(`shop.reignstide.org`)"
      traefik.http.routers.reigns-tide-shop-https.entryPoints: "https"
      traefik.http.routers.reigns-tide-shop-https.middlewares: "reigns-tide-shop-gzip"
      traefik.http.routers.reigns-tide-shop-https.rule: "Host(`shop.reignstide.org`)"
      traefik.http.routers.reigns-tide-shop-https.tls: "true"
      traefik.http.routers.reigns-tide-shop-https.tls.certresolver: "letsencrypt"
      traefik.http.services.reigns-tide-shop.loadbalancer.server.port: "80"

  wpcli:
    image: wordpress:cli-php8.3
    profiles: ["tools"]
    depends_on:
      wordpress-db:
        condition: service_healthy
    volumes:
      - ./wordpress/html:/var/www/html
    environment:
      WORDPRESS_DB_HOST: wordpress-db:3306
      WORDPRESS_DB_NAME: ${WORDPRESS_DB_NAME}
      WORDPRESS_DB_USER: ${WORDPRESS_DB_USER}
      WORDPRESS_DB_PASSWORD: ${WORDPRESS_DB_PASSWORD}
    networks:
      - wordpress

networks:
  coolify:
    external: true
  wordpress:
    driver: bridge
